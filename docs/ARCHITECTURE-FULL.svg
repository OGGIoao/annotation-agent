<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1800" viewBox="0 0 2800 1800" role="img" aria-labelledby="title desc">
  <title id="title">题目智能标注 Agent 完整系统架构</title>
  <desc id="desc">由控制与审计平面、标注智能平面、平台执行平面组成的端到端题目标注 Agent 架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#0e2634"/></linearGradient>
    <linearGradient id="intel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#113a35"/><stop offset="1" stop-color="#0c2727"/></linearGradient>
    <linearGradient id="exec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2b16"/><stop offset="1" stop-color="#2b1d13"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#263449" stroke-width="1" opacity=".45"/></pattern>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6ee7b7"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fb7185"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}
      .subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .plane-title{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e2e8f0}
      .node-title{font:700 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}
      .node-sub{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .small{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .edge-label{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a5f3fc}
      .control-node{fill:#102c3b;stroke:#22d3ee;stroke-width:2}
      .intel-node{fill:#102f2b;stroke:#34d399;stroke-width:2}
      .exec-node{fill:#382817;stroke:#fbbf24;stroke-width:2}
      .review-node{fill:#3b1828;stroke:#fb7185;stroke-width:2}
      .storage{fill:#271b45;stroke:#a78bfa;stroke-width:2}
      .external{fill:#1e293b;stroke:#94a3b8;stroke-width:2}
      .edge-cyan{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow-cyan)}
      .edge-green{stroke:#6ee7b7;stroke-width:3;fill:none;marker-end:url(#arrow-green)}
      .edge-orange{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#arrow-orange)}
      .edge-rose{stroke:#fb7185;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow-rose)}
      .dashed{stroke-dasharray:12 9}
    </style>
  </defs>

  <rect width="2800" height="1800" fill="url(#bg)"/>
  <rect width="2800" height="1800" fill="url(#grid)" opacity=".28"/>

  <!-- Header -->
  <circle cx="100" cy="88" r="9" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="130" y="103" class="title">题目智能标注 Agent · 完整系统架构</text>
  <text x="130" y="138" class="subtitle">从任务进入、题目标注理解，到平台受控执行与保存确认的闭环设计</text>
  <text x="2650" y="100" text-anchor="end" class="code">v0.3 / DESIGN</text>

  <!-- Control plane -->
  <rect x="70" y="175" width="2660" height="230" rx="18" fill="url(#control)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="105" y="215" class="plane-title">① 控制与审计平面 · 任务状态、检查点、人工复核和整包策略</text>
  <text x="105" y="246" class="small">LangGraph 只负责流程状态和节点调度，不负责坐标计算、不隐式决定业务规则、不自由操作浏览器</text>

  <rect x="110" y="275" width="300" height="92" rx="10" class="control-node" filter="url(#shadow)"/>
  <text x="260" y="310" text-anchor="middle" class="node-title">任务配置 / 人工审核</text>
  <text x="260" y="338" text-anchor="middle" class="node-sub">任务范围 · 学科 · 复核入口</text>
  <text x="260" y="360" text-anchor="middle" class="node-sub">人机协同控制</text>

  <rect x="465" y="275" width="300" height="92" rx="10" class="control-node" filter="url(#shadow)"/>
  <text x="615" y="310" text-anchor="middle" class="node-title">FastAPI 任务接口</text>
  <text x="615" y="338" text-anchor="middle" class="node-sub">创建任务 · 状态查询</text>
  <text x="615" y="360" text-anchor="middle" class="node-sub">结果 · 复核原因 · 指标</text>

  <rect x="820" y="265" width="420" height="112" rx="10" class="control-node" filter="url(#shadow)"/>
  <text x="1030" y="304" text-anchor="middle" class="node-title">LangGraph 状态与阶段调度</text>
  <text x="1030" y="333" text-anchor="middle" class="node-sub">节点 · 条件分支 · 超时 · 恢复</text>
  <text x="1030" y="357" text-anchor="middle" class="node-sub">人工介入后继续 · 最多一次局部修正</text>

  <rect x="1295" y="275" width="285" height="92" rx="10" class="storage" filter="url(#shadow)"/>
  <text x="1437" y="310" text-anchor="middle" class="node-title">检查点 / 状态快照</text>
  <text x="1437" y="338" text-anchor="middle" class="node-sub">可恢复 · 可追溯</text>
  <text x="1437" y="360" text-anchor="middle" class="node-sub">任务阶段和中间结果</text>

  <rect x="1635" y="275" width="285" height="92" rx="10" class="storage" filter="url(#shadow)"/>
  <text x="1777" y="310" text-anchor="middle" class="node-title">动作日志 / 审计证据</text>
  <text x="1777" y="338" text-anchor="middle" class="node-sub">动作前后状态 · 截图</text>
  <text x="1777" y="360" text-anchor="middle" class="node-sub">模型、规则、代码版本</text>

  <rect x="1975" y="275" width="300" height="92" rx="10" class="control-node" filter="url(#shadow)"/>
  <text x="2125" y="310" text-anchor="middle" class="node-title">整包完成检查</text>
  <text x="2125" y="338" text-anchor="middle" class="node-sub">页面是否齐全 · 关系是否完整</text>
  <text x="2125" y="360" text-anchor="middle" class="node-sub">提交策略 · 是否允许进入执行</text>

  <rect x="2330" y="275" width="355" height="92" rx="10" class="review-node" filter="url(#shadow)"/>
  <text x="2507" y="310" text-anchor="middle" class="node-title">人工复核队列</text>
  <text x="2507" y="338" text-anchor="middle" class="node-sub">低置信度 · 规则冲突 · 平台未知</text>
  <text x="2507" y="360" text-anchor="middle" class="node-sub">结构化原因，不静默失败</text>

  <path d="M410 321H465" class="edge-cyan"/><path d="M765 321H820" class="edge-cyan"/>
  <path d="M1240 321H1295" class="edge-cyan"/><path d="M1240 342H1635" class="edge-cyan"/>
  <path d="M1240 300H1975" class="edge-cyan"/><path d="M1240 360H2330" class="edge-rose"/>

  <!-- Intelligence plane -->
  <rect x="70" y="460" width="1620" height="1150" rx="18" fill="url(#intel)" stroke="#34d399" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="105" y="503" class="plane-title">② 标注智能平面 · 页面理解、题目结构、答案关系与业务规则</text>
  <text x="105" y="533" class="small">模型只生成候选；Pydantic、领域模型和规则校验器负责把候选变成可信的 AnnotationResult</text>

  <!-- intelligence nodes row 1 -->
  <rect x="110" y="580" width="330" height="115" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="275" y="617" text-anchor="middle" class="node-title">任务与页面采集</text>
  <text x="275" y="647" text-anchor="middle" class="node-sub">离线图片 / 平台页面</text>
  <text x="275" y="671" text-anchor="middle" class="node-sub">已有标注 · 页码 · 身份前置信息</text>

  <rect x="485" y="580" width="330" height="115" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="650" y="617" text-anchor="middle" class="node-title">页面解析</text>
  <text x="650" y="647" text-anchor="middle" class="node-sub">PaddleOCR / PP-StructureV3</text>
  <text x="650" y="671" text-anchor="middle" class="node-sub">文字 · 版面 · 表格 · 公式 · 坐标</text>

  <rect x="860" y="580" width="330" height="115" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="1025" y="617" text-anchor="middle" class="node-title">候选区域生成</text>
  <text x="1025" y="647" text-anchor="middle" class="node-sub">题号 · 小题号 · 栏位</text>
  <text x="1025" y="671" text-anchor="middle" class="node-sub">横线 · 作答区 · 答案候选</text>

  <rect x="1235" y="580" width="400" height="115" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="1435" y="617" text-anchor="middle" class="node-title">多模态理解适配器</text>
  <text x="1435" y="647" text-anchor="middle" class="node-sub">首轮候选：Qwen3-VL Instruct API</text>
  <text x="1435" y="671" text-anchor="middle" class="node-sub">边界 · 题型 · 关系 · 答案 · 置信度</text>

  <!-- intelligence nodes row 2 -->
  <rect x="110" y="785" width="330" height="125" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="275" y="823" text-anchor="middle" class="node-title">答案与上下文索引</text>
  <text x="275" y="853" text-anchor="middle" class="node-sub">教材 → 章节 → 页码</text>
  <text x="275" y="877" text-anchor="middle" class="node-sub">题号 → 答案候选</text>
  <text x="275" y="899" text-anchor="middle" class="node-sub">二维码 / 听力 / 无答案状态</text>

  <rect x="485" y="785" width="330" height="125" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="650" y="823" text-anchor="middle" class="node-title">Pydantic 数据契约</text>
  <text x="650" y="853" text-anchor="middle" class="node-sub">BoundingBox · QuestionNode</text>
  <text x="650" y="877" text-anchor="middle" class="node-sub">AnswerBox · AnswerLink</text>
  <text x="650" y="899" text-anchor="middle" class="node-sub">防止模型输出结构漂移</text>

  <rect x="860" y="785" width="330" height="125" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="1025" y="823" text-anchor="middle" class="node-title">整包题目关系图</text>
  <text x="1025" y="853" text-anchor="middle" class="node-sub">题目树 · 父子 · 跨栏</text>
  <text x="1025" y="877" text-anchor="middle" class="node-sub">跨页 · 独立答案 · 回填绑定</text>
  <text x="1025" y="899" text-anchor="middle" class="node-sub">TaskPackage 级聚合</text>

  <rect x="1235" y="785" width="400" height="125" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="1435" y="823" text-anchor="middle" class="node-title">版本化规则与证据</text>
  <text x="1435" y="853" text-anchor="middle" class="node-sub">YAML 规则 · 学科 · 题型</text>
  <text x="1435" y="877" text-anchor="middle" class="node-sub">答案来源 · 特殊条件</text>
  <text x="1435" y="899" text-anchor="middle" class="node-sub">RuleTrace · 规则版本</text>

  <!-- intelligence nodes row 3 -->
  <rect x="260" y="1025" width="390" height="135" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="455" y="1063" text-anchor="middle" class="node-title">规则决策</text>
  <text x="455" y="1093" text-anchor="middle" class="node-sub">无答案 · 例题 · 残题</text>
  <text x="455" y="1117" text-anchor="middle" class="node-sub">虚线类型 · 题型 · 封闭性</text>
  <text x="455" y="1141" text-anchor="middle" class="node-sub">生成应执行的业务动作</text>

  <rect x="705" y="1025" width="430" height="135" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="920" y="1063" text-anchor="middle" class="node-title">契约与业务校验 · 质量门禁</text>
  <text x="920" y="1093" text-anchor="middle" class="node-sub">坐标 · 编号 · 父子 · 跨页 · 答案绑定</text>
  <text x="920" y="1117" text-anchor="middle" class="node-sub">规则冲突 · 回填格式 · 越界和重复</text>
  <text x="920" y="1141" text-anchor="middle" class="node-sub">通过 / 局部修正 / 人工复核</text>

  <rect x="1190" y="1025" width="445" height="135" rx="10" class="intel-node" filter="url(#shadow)"/>
  <text x="1412" y="1063" text-anchor="middle" class="node-title">AnnotationResult</text>
  <text x="1412" y="1093" text-anchor="middle" class="node-sub">题目框 · 答案框 · 关系 · 回填答案</text>
  <text x="1412" y="1117" text-anchor="middle" class="node-sub">题型 · 虚线 · 封闭性 · 置信度</text>
  <text x="1412" y="1141" text-anchor="middle" class="node-sub">模型 / OCR / 规则 / 代码版本</text>

  <!-- intelligence lower note -->
  <rect x="180" y="1270" width="1400" height="245" rx="12" fill="#0b2425" stroke="#34d399" stroke-width="1.5"/>
  <text x="220" y="1310" class="node-title">标注智能层的硬边界</text>
  <text x="220" y="1350" class="node-sub">模型：看懂页面、提出候选、给置信度和证据</text>
  <text x="220" y="1384" class="node-sub">程序：统一坐标、构建题目树、执行规则、校验关系和格式</text>
  <text x="220" y="1418" class="node-sub">人工：处理低置信度、答案歧义、规则冲突和复杂视觉题</text>
  <text x="220" y="1470" class="code">不允许：模型候选 → 直接写库 / 直接点击 / 直接提交</text>

  <!-- intelligence edges -->
  <path d="M440 637H485" class="edge-green"/><path d="M815 637H860" class="edge-green"/><path d="M1190 637H1235" class="edge-green"/>
  <path d="M650 695V785" class="edge-green"/><path d="M1435 695V785" class="edge-green"/>
  <path d="M440 847H485" class="edge-green"/><path d="M815 847H860" class="edge-green"/><path d="M1190 847H1235" class="edge-green"/>
  <path d="M1025 910V970H455V1025" class="edge-green"/>
  <path d="M1435 910V970H455V1025" class="edge-green"/>
  <path d="M650 910V985H920V1025" class="edge-green"/>
  <path d="M1025 910V1025" class="edge-green"/>
  <path d="M650 910V985H920V1025" class="edge-green"/>
  <path d="M650 910V985H1412V1025" class="edge-green"/>
  <path d="M1135 1092H1190" class="edge-green"/>

  <!-- Execution plane -->
  <rect x="1760" y="460" width="970" height="1150" rx="18" fill="url(#exec)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="1795" y="503" class="plane-title">③ 平台执行平面 · 动作计划、浏览器执行与保存确认</text>
  <text x="1795" y="533" class="small">执行器只接受经过校验的 ActionPlan，不重新猜测题型，不自行修改业务规则</text>

  <rect x="1810" y="590" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2005" y="630" text-anchor="middle" class="node-title">ActionPlan</text>
  <text x="2005" y="660" text-anchor="middle" class="node-sub">最小差异动作计划</text>
  <text x="2005" y="684" text-anchor="middle" class="node-sub">前置条件 · 动作白名单</text>
  <text x="2005" y="708" text-anchor="middle" class="node-sub">预期页面变化 · 最大动作数</text>

  <rect x="2280" y="590" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2475" y="630" text-anchor="middle" class="node-title">执行前安全门禁</text>
  <text x="2475" y="660" text-anchor="middle" class="node-sub">任务 / 页面 / 账号确认</text>
  <text x="2475" y="684" text-anchor="middle" class="node-sub">测试环境开关 · 超时 · 动作数</text>
  <text x="2475" y="708" text-anchor="middle" class="node-sub">不满足条件：停止并复核</text>

  <rect x="1810" y="820" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2005" y="860" text-anchor="middle" class="node-title">平台适配器</text>
  <text x="2005" y="890" text-anchor="middle" class="node-sub">AnnotationResult → 平台动作</text>
  <text x="2005" y="914" text-anchor="middle" class="node-sub">隔离平台差异</text>
  <text x="2005" y="938" text-anchor="middle" class="node-sub">API 或浏览器事件</text>

  <rect x="2280" y="820" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2475" y="860" text-anchor="middle" class="node-title">单一浏览器执行器</text>
  <text x="2475" y="890" text-anchor="middle" class="node-sub">单一会话 · 操作白名单</text>
  <text x="2475" y="914" text-anchor="middle" class="node-sub">受控点击 / 框 / 关联 / 保存</text>
  <text x="2475" y="938" text-anchor="middle" class="node-sub">不自由导航、不自由猜测</text>

  <rect x="1810" y="1060" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2005" y="1100" text-anchor="middle" class="node-title">ExecutionReceipt</text>
  <text x="2005" y="1130" text-anchor="middle" class="node-sub">动作结果 · 前后状态摘要</text>
  <text x="2005" y="1154" text-anchor="middle" class="node-sub">截图 / DOM 证据 · 错误</text>
  <text x="2005" y="1178" text-anchor="middle" class="node-sub">是否需要重新采集或复核</text>

  <rect x="2280" y="1060" width="390" height="135" rx="10" class="exec-node" filter="url(#shadow)"/>
  <text x="2475" y="1100" text-anchor="middle" class="node-title">新界面观察与保存确认</text>
  <text x="2475" y="1130" text-anchor="middle" class="node-sub">框 / 关系 / 属性是否出现</text>
  <text x="2475" y="1154" text-anchor="middle" class="node-sub">保存按钮 / 刷新后状态</text>
  <text x="2475" y="1178" text-anchor="middle" class="node-sub">确认成功 or 差异 / 未知</text>

  <rect x="1810" y="1280" width="860" height="235" rx="12" fill="#2b2012" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1850" y="1320" class="node-title">平台执行层的硬边界</text>
  <text x="1850" y="1360" class="node-sub">先做 FakeExecutor，再接测试平台，最后评估生产提交</text>
  <text x="1850" y="1394" class="node-sub">点击保存 ≠ 保存成功，必须观察页面并生成 ExecutionReceipt</text>
  <text x="1850" y="1428" class="node-sub">差异或结果未知 → 重新采集；不能裁定 → 人工复核</text>
  <text x="1850" y="1480" class="code">禁止：AnnotationResult → 盲目点击 / 自由浏览 / 自动提交</text>

  <!-- external platform -->
  <rect x="2410" y="1545" width="270" height="48" rx="9" class="external"/>
  <text x="2545" y="1576" text-anchor="middle" class="node-title">外部标注平台</text>

  <!-- execution edges -->
  <path d="M1635 1092H1720V657H1810" class="edge-orange"/>
  <path d="M2200 657H2280" class="edge-orange"/>
  <path d="M2475 725V820" class="edge-orange"/>
